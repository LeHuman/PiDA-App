name: Build APK

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image ships a preinstalled Android SDK (ANDROID_HOME
      # set, licenses pre-accepted); no SDK setup action is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Tags look like x.x.x, with or without a leading v.
            # Strip the v from the TAG NAME ONLY (${ver#v}), never the
            # whole output line: sed 's/^v//' would eat the "v" of
            # "version=" and yield an empty output.
            ver="${{ github.ref_name }}"
            echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+sha.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
          # GitHub expressions have no arithmetic; add in the shell instead.
          # versionCode must never regress (Android refuses downgrades), so
          # 100 + run number keeps it monotonic across every build.
          echo "code=$((100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      # Sign with the same debug keystore as local builds (base64 secret), so
      # CI APKs upgrade in place over locally-installed builds without the
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE signature mismatch. The path is
      # passed explicitly (-PdebugKeystoreFile): runner images redirect the
      # Android prefs dir, so AGP's default ~/.android lookup is unreliable.
      - name: Restore debug signing keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          sha256sum "$RUNNER_TEMP/debug.keystore"

      - name: Build debug APK
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.code }}
          -PdebugKeystoreFile=$RUNNER_TEMP/debug.keystore

      - name: Stage versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PiDA-App_${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pida-app-apk
          path: PiDA-App_*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pida-app-apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: PiDA-App_*.apk
          generate_release_notes: true